<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sync App</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  width: 320px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
  cursor: pointer;
}

.create { background: #8b5cf6; color: white; }
.connect { background: #3b82f6; color: white; }
.accept { background: #22c55e; color: white; }

.status {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">

<h2>ペア接続</h2>

<button class="create" onclick="createPair()">コード生成</button>

<input id="pairId" placeholder="ペアID">

<button class="connect" onclick="requestPair()">接続</button>
<button class="accept" onclick="acceptPair()">許可</button>

<p id="timer" class="status"></p>
<p id="status" class="status">未接続</p>

</div>

<script>
let pairId = "";
let connected = false;
let notified = false;
let expireTimer = null;

// 通知許可
async function enableNotification() {
  if (Notification.permission !== "granted") {
    await Notification.requestPermission();
  }
}

// 🔥 コード生成
async function createPair() {
  const res = await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ action: "create" })
  });

  const data = await res.json();

  pairId = data.pairId;
  document.getElementById("pairId").value = pairId;

  document.getElementById("status").textContent = "コード生成完了";

  startTimer(60);
}

// ⏱️ タイマー
function startTimer(seconds) {
  clearInterval(expireTimer);

  expireTimer = setInterval(() => {
    seconds--;

    document.getElementById("timer").textContent =
      `有効期限: ${seconds}秒`;

    if (seconds <= 0) {
      clearInterval(expireTimer);
      document.getElementById("status").textContent = "期限切れ";
    }
  }, 1000);
}

// 接続
async function requestPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "request"
    })
  });

  document.getElementById("status").textContent = "接続待機中...";
  await enableNotification();

  watchStatus();
}

// 許可
async function acceptPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "accept"
    })
  });

  document.getElementById("status").textContent = "許可しました";
}

// 状態監視
function watchStatus() {
  setInterval(async () => {
    if (connected) return;

    const res = await fetch(`/api/pair?pairId=${pairId}`);
    const data = await res.json();

    if (data.expired) {
      document.getElementById("status").textContent = "期限切れ";
      return;
    }

    if (data.accepted && !notified) {
      notified = true;
      connected = true;

      document.getElementById("status").textContent = "接続済み";

      new Notification("接続成功", {
        body: "ペア接続が許可されました！"
      });

      alert("許可されました!!");
    }
  }, 2000);
}
</script>

</body>
</html>
