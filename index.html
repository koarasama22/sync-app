<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Sync App</title>
</head>
<body>

<h2>ペア接続</h2>

<input id="pairId" placeholder="ペアIDを入力">
<button onclick="pair()">接続</button>

<h2>ファイル送信</h2>

<input type="file" id="fileInput">
<button onclick="sendFile()">送信</button>

<p id="status"></p>

<script>
let ws
let myId = Math.random().toString(36).substring(2, 8)
let targetId = null

ws = new WebSocket("ws://localhost:3000")

ws.onopen = () => {
    ws.send(JSON.stringify({ type: "register", id: myId }))
}

ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data)

    if (msg.type === "pair-success") {
        targetId = msg.from
        document.getElementById("status").innerText = "接続成功"
    }

    if (msg.type === "pair-notify") {
        document.getElementById("status").innerText = "相手が接続しました"
    }

    if (msg.type === "paired-confirm") {
        document.getElementById("status").innerText = "許可されました!!"
    }

    if (msg.type === "file") {
        const blob = new Blob([Uint8Array.from(atob(msg.data), c => c.charCodeAt(0))])
        const url = URL.createObjectURL(blob)

        const a = document.createElement("a")
        a.href = url
        a.download = msg.name
        a.click()
    }
}

function pair() {
    const id = document.getElementById("pairId").value
    ws.send(JSON.stringify({ type: "pair", target: id }))
}

function sendFile() {
    const file = document.getElementById("fileInput").files[0]
    const reader = new FileReader()

    reader.onload = () => {
        const base64 = btoa(
            new Uint8Array(reader.result)
                .reduce((data, byte) => data + String.fromCharCode(byte), "")
        )

        ws.send(JSON.stringify({
            type: "file",
            to: targetId,
            name: file.name,
            data: base64
        }))
    }

    reader.readAsArrayBuffer(file)
}
</script>

</body>
</html>
