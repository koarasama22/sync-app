<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sync App</title>
</head>
<body>

<h2>ペア接続</h2>

<input id="pairId" placeholder="ペアIDを入力">
<button onclick="requestPair()">接続</button>
<button onclick="acceptPair()">許可</button>

<p id="status">未接続</p>

<h2>ファイル送信</h2>

<input type="file" id="fileInput">
<p id="fileName">選択されていません</p>
<button onclick="sendFile()">送信</button>

<script>
let pairId = "";
let connected = false;
let notified = false;

// ファイル名表示
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  document.getElementById("fileName").textContent =
    file ? file.name : "選択されていません";
});

// 通知許可
async function enableNotification() {
  if (Notification.permission !== "granted") {
    await Notification.requestPermission();
  }
}

// 接続リクエスト
async function requestPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "request"
    })
  });

  document.getElementById("status").textContent = "接続リクエスト送信中...";
  enableNotification();

  watchStatus();
}

// 許可（受信側）
async function acceptPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "accept"
    })
  });

  document.getElementById("status").textContent = "接続を許可しました";
}

// 状態監視（ポーリング）
function watchStatus() {
  setInterval(async () => {
    if (connected) return;

    const res = await fetch(`/api/pair?pairId=${pairId}`);
    const data = await res.json();

    if (data.accepted && !notified) {
      notified = true;
      connected = true;

      document.getElementById("status").textContent = "接続済み";

      new Notification("接続成功", {
        body: "ペア接続が許可されました！"
      });

      alert("許可されました!!");
    }
  }, 2000);
}

// ファイル送信
async function sendFile() {
  if (!connected) {
    alert("接続されていません");
    return;
  }

  const file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("ファイルを選択してください");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("pairId", pairId);
  formData.append("action", "send");

  await fetch("/api/pair", {
    method: "POST",
    body: formData
  });

  alert("送信しました");
}
</script>

</body>
</html>
