<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sync App</title>
</head>
<body>

<h2>ペア接続</h2>

<input id="pairId" placeholder="ペアIDを入力">
<button onclick="requestPair()">接続</button>
<button onclick="acceptPair()">許可</button>

<p id="status">未接続</p>

<script>
let pairId = "";
let connected = false;
let notified = false;

// 🔔 通知許可
async function enableNotification() {
  if (Notification.permission !== "granted") {
    await Notification.requestPermission();
  }
}

// 🔗 接続リクエスト
async function requestPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "request"
    })
  });

  document.getElementById("status").textContent = "リクエスト送信中...";
  
  await enableNotification();

  watchStatus();
}

// ✅ 許可（受信側）
async function acceptPair() {
  pairId = document.getElementById("pairId").value;

  await fetch("/api/pair", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      pairId,
      action: "accept"
    })
  });

  document.getElementById("status").textContent = "許可しました";
}

// 🔄 状態監視（ここが通知の核）
function watchStatus() {
  setInterval(async () => {
    if (connected) return;

    const res = await fetch(`/api/pair?pairId=${pairId}`);
    const data = await res.json();

    if (data.accepted && !notified) {
      notified = true;
      connected = true;

      document.getElementById("status").textContent = "接続済み";

      new Notification("接続成功", {
        body: "ペア接続が許可されました！"
      });

      alert("許可されました!!");
    }
  }, 2000);
}
</script>

</body>
</html>
