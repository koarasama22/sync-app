<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Sync App</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px;
      margin-top: 10px;
      width: 100%;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    input {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🔗 Sync App</h1>

  <!-- コード生成 -->
  <div class="box">
    <h3>コード発行</h3>
    <div id="code">----</div>
    <button onclick="generateCode()">コード生成</button>
    <div id="timer"></div>
    <button onclick="approveConnection()">承認する</button>
  </div>

  <!-- 接続 -->
  <div class="box">
    <h3>接続する</h3>
    <input id="inputCode" placeholder="コード入力">
    <button onclick="requestConnection()">接続申請</button>
  </div>

  <div id="status"></div>

  <script>
    let currentCode = "";
    let countdown = null;

    // コード生成
    async function generateCode() {
      const res = await fetch("/api/pair", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ action: "generate" })
      });

      const data = await res.json();
      currentCode = data.code;

      document.getElementById("code").innerText = currentCode;
      document.getElementById("status").innerText = "コード発行中...";

      startTimer(30);
    }

    // タイマー
    function startTimer(sec) {
      clearInterval(countdown);

      countdown = setInterval(() => {
        sec--;
        document.getElementById("timer").innerText = `有効期限: ${sec}秒`;

        if (sec <= 0) {
          clearInterval(countdown);
          document.getElementById("code").innerText = "----";
          document.getElementById("timer").innerText = "期限切れ";
          currentCode = "";
        }
      }, 1000);
    }

    // 接続申請
    async function requestConnection() {
      const code = document.getElementById("inputCode").value;

      const res = await fetch("/api/pair", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "request",
          code
        })
      });

      const data = await res.json();

      if (data.ok) {
        document.getElementById("status").innerText = "申請送信済み...";
      } else {
        document.getElementById("status").innerText = "無効なコード";
      }
    }

    // 承認
    async function approveConnection() {
      if (!currentCode) {
        alert("コードがありません");
        return;
      }

      await fetch("/api/pair", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "approve",
          code: currentCode
        })
      });

      document.getElementById("status").innerText = "承認しました";
    }

    // 状態チェック
    setInterval(async () => {
      if (!currentCode) return;

      const res = await fetch("/api/pair", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "check",
          code: currentCode
        })
      });

      const data = await res.json();

      if (data.approved) {
        document.getElementById("status").innerText = "✅ 接続成功！";
      }
    }, 2000);
  </script>

</body>
</html>
